table_name: glosario_terminos
main_dttm_col: null
description: Glosario oficial de conceptos de negocio ferroviario y arquitectura técnica de la plataforma.
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
catalog: null
sql: |-
  -- Glosario de Términos de Raillytics: conceptos oficiales declarados en config/glosario.yml
  -- Se genera con `make catalog` (raillytics.catalog): no lo edites a mano.
  WITH glosario(termino, dominio, tipo, definicion, formula, sinonimos, tablas_relacionadas) AS (VALUES
      ('Corredor Ferroviario', 'Negocio Ferroviario', 'Negocio', 'Eje o infraestructura troncal que conecta grandes nodos urbanos o regiones geográficas (p. ej. Madrid–Barcelona, Madrid–Levante, Madrid–Andalucía). En Raillytics el análisis central se focaliza en el corredor de alta velocidad AVE-MAD-BCN.', '-', 'Corredor, Eje troncal', 'fact_mercado_trimestral, fact_viajeros, dim_linea'),
      ('Cuota de Mercado (Market Share)', 'Negocio Ferroviario', 'Negocio', 'Proporción de la demanda total de viajeros capturada por un operador específico en un corredor o periodo respecto al conjunto de operadores en competencia.', 'round(100.0 * viajeros_operador / total_viajeros_corredor, 2)', 'Cuota, Participación de mercado', 'fact_mercado_trimestral, mercado_trimestral'),
      ('Obligación de Servicio Público (OSP)', 'Negocio Ferroviario', 'Negocio', 'Servicios de transporte de viajeros garantizados por el Estado o administraciones autonómicas con compensaciones económicas públicas (p. ej. Cercanías, Media Distancia Convencional, Ancho Métrico).', '-', 'OSP, Servicio público regulado', 'cnmc_indicadores, cnmc_viajeros_producto'),
      ('Ocupación (Factor de Carga)', 'Negocio Ferroviario', 'Negocio', 'Porcentaje de aprovechamiento de la capacidad disponible, calculado como el cociente entre viajeros·km y plazas·km ofertadas (o viajeros entre plazas ofertadas).', 'round(100.0 * viajeros_km / plazas_km_ofertadas, 2)', 'Load Factor, Factor de ocupación', 'fact_mercado_trimestral, cnmc_trimestral'),
      ('Plazas Ofertadas', 'Negocio Ferroviario', 'Negocio', 'Capacidad nominal máxima de asientos comercializados por los operadores ferroviarios en las circulaciones puestas a disposición del público.', 'SUM(plazas_ofertadas)', 'Capacidad, Asientos disponibles', 'fact_viajeros, fact_mercado_trimestral, cnmc_viajeros_corredor'),
      ('Plazas·km Ofertadas', 'Negocio Ferroviario', 'Negocio', 'Medida de oferta total de capacidad obtenida multiplicando el número de plazas ofertadas de cada tren por los kilómetros de su recorrido.', 'SUM(plazas_ofertadas * distancia_km)', 'Asientos-kilómetro ofertados (AKO)', 'cnmc_trimestral, fact_mercado_trimestral'),
      ('Precio Medio por Trayecto', 'Negocio Ferroviario', 'Negocio', 'Importe promedio del billete abonado por viajero para un par origen-destino determinado en el periodo de análisis.', 'AVG(precio_eur)', 'Tarifa media, Average Fare', 'fact_precio_mensual, fact_precio_trimestral'),
      ('Puntualidad Comercial', 'Negocio Ferroviario', 'Negocio', 'Porcentaje de servicios ferroviarios que llegan a destino o estación intermedia dentro del margen de tolerancia de retraso establecido (en alta velocidad habitualmente < 5 minutos).', 'round(100.0 * COUNT(CASE WHEN retraso_minutos <= 5 THEN 1 END) / COUNT(*), 2)', 'On-Time Performance (OTP), Índice de puntualidad', 'fact_puntualidad, puntualidad_servicios'),
      ('Retraso Medio', 'Negocio Ferroviario', 'Negocio', 'Tiempo medio en minutos de demora acumulada por los trenes en circulación respecto al horario comercial teórico programado.', 'AVG(retraso_minutos)', 'Demora media, Delay', 'fact_puntualidad, puntualidad_servicios'),
      ('Servicios Comerciales Liberalizados', 'Negocio Ferroviario', 'Negocio', 'Servicios ferroviarios de Alta Velocidad y Larga Distancia explotados a riesgo y ventura de empresas ferroviarias autorizadas en régimen de competencia efectiva (Renfe Viajeros, ILSA / Iryo, Ouigo España).', '-', 'Servicios liberalizados, Larga Distancia AV', 'fact_mercado_trimestral, dim_operador'),
      ('Tasa de Cancelación', 'Negocio Ferroviario', 'Negocio', 'Porcentaje de circulaciones programadas que fueron suprimidas o canceladas sin prestar el servicio a los viajeros.', 'round(100.0 * COUNT(CASE WHEN estado_servicio = ''cancelado'' THEN 1 END) / COUNT(*), 2)', 'Servicios cancelados', 'fact_puntualidad, puntualidad_servicios'),
      ('Tren·km', 'Negocio Ferroviario', 'Negocio', 'Distancia total en kilómetros recorrida por las composiciones de tren en servicio comercial, con independencia del número de viajeros o coches.', 'SUM(tren_km)', 'Trenes-kilómetro', 'fact_mercado_trimestral, cnmc_indicadores'),
      ('Viajeros (Pax)', 'Negocio Ferroviario', 'Negocio', 'Número de pasajeros que utilizan un servicio de transporte ferroviario durante un trayecto o periodo temporal determinado.', 'SUM(viajeros)', 'Pasajeros, Pax, Demanda', 'fact_viajeros, fact_mercado_trimestral, cnmc_viajeros_corredor'),
      ('Viajeros·km', 'Negocio Ferroviario', 'Negocio', 'Unidad compuesta de producción y demanda que representa el transporte de un viajero a lo largo de un kilómetro de distancia.', 'SUM(viajeros * distancia_km)', 'Pasajeros-kilómetro, Tráfico de viajeros', 'cnmc_trimestral, fact_mercado_trimestral'),
      ('Arquitectura Medallion', 'Plataforma Data Lakehouse', 'Técnico', 'Patrón de diseño de ingeniería de datos que organiza el almacenamiento en tres capas progresivas de calidad y refinamiento: Bronze (bruto/ingesta), Silver (limpio/conforme) y Gold (agregado/dimensional).', '-', 'Capas Bronze/Silver/Gold', '_trazabilidad/cargas, lineage_nodos'),
      ('Capa Bronze L1 (Raw)', 'Plataforma Data Lakehouse', 'Técnico', 'Almacenamiento inmutable en MinIO que preserva los ficheros tal como fueron descargados de las fuentes externas (CSV, JSON, ZIP), sirviendo como copia forense auditable.', '-', 'L1, Bronze Raw', '_trazabilidad/cargas'),
      ('Capa Bronze L2 (Parquet)', 'Plataforma Data Lakehouse', 'Técnico', 'Transformación técnica streaming/batch de L1 a formato Parquet columnar optimizado, descomprimiendo ZIPs (p. ej. GTFS) y preservando los esquemas fuente.', '-', 'L2, Bronze Parquet', '_trazabilidad/cargas'),
      ('Capa Gold', 'Plataforma Data Lakehouse', 'Técnico', 'Modelos dimensionales analíticos (esquema en estrella con tablas de hechos y dimensiones) almacenados en Parquet/MinIO, listos para consumo directo desde BI (DuckDB + Superset).', '-', 'Gold, Data Marts', 'dim_fecha, dim_estacion, fact_viajeros, fact_mercado_trimestral'),
      ('Capa Silver', 'Plataforma Data Lakehouse', 'Técnico', 'Tablas limpias, tipadas, sin duplicados y enriquecidas gestionadas en Delta Lake mediante Spark Streaming o transformaciones SQL reproducibles.', '-', 'Silver, Curated Zone', 'silver_cnmc_trimestral, silver_viajeros_enriquecidos'),
      ('DuckDB', 'Plataforma Data Lakehouse', 'Técnico', 'Motor SQL columnar OLAP embebido en Superset que permite consultar con alto rendimiento ficheros Parquet almacenados en MinIO/S3 sin necesidad de levantar un almacén de datos externo pesado.', '-', 'Motor SQL analítico', 'datasets/Raillytics_Gold_DuckDB'),
      ('Frescura de Datos (Freshness)', 'Plataforma Data Lakehouse', 'Técnico', 'Tiempo transcurrido desde la marca temporal de la última carga exitosa de una tabla hasta el instante presente, empleado para monitorizar retrasos de ingesta.', 'date_diff(''hour'', max(fin_carga), current_timestamp)', 'Freshness, Latencia de datos', 'frescura_tablas, _trazabilidad/cargas'),
      ('Grano de Datos (Granularidad)', 'Plataforma Data Lakehouse', 'Técnico', 'El nivel exacto de detalle y significado individual que representa cada fila contenida en una tabla o dataset.', '-', 'Granularidad, Grain', 'data_catalog, config/data_catalog.yml'),
      ('Lineage de Cargas (Linaje)', 'Plataforma Data Lakehouse', 'Técnico', 'Grafo de dependencias que conecta cada fuente de datos con sus tablas intermedias, modelos, datasets y dashboards, cruzado con el estado observado de las cargas.', '-', 'Data Lineage, Linaje de datos', 'lineage_nodos, lineage_aristas, lineage_cargas'),
      ('Quality Gate (Control de Calidad)', 'Plataforma Data Lakehouse', 'Técnico', 'Validación automatizada de reglas de integridad (filas mínimas, no nulos, unicidad de grano, rango de valores, coherencia relacional) aplicada a una tabla durante su procesamiento.', '-', 'Gate, Data Quality Check', 'config/quality_gates.yml, _trazabilidad/calidad'),
      ('Quality Gate Aviso', 'Plataforma Data Lakehouse', 'Técnico', 'Regla de calidad preventiva que registra una alerta en la trazabilidad (''aviso'') sin abortar la ejecución ni bloquear la escritura de la tabla.', '-', 'Warning gate', 'config/quality_gates.yml, _trazabilidad/calidad'),
      ('Quality Gate Bloqueante', 'Plataforma Data Lakehouse', 'Técnico', 'Regla de calidad crítica cuya no superación detiene inmediatamente la promoción de datos a la capa destino y envía los registros a cuarentena con estado ''error''.', '-', 'Gate crítico, Fail-closed', 'config/quality_gates.yml, _trazabilidad/calidad'),
      ('Run ID', 'Plataforma Data Lakehouse', 'Técnico', 'Identificador unívoco temporal de ejecución (formato: AAAAMMDDTHHMMSS-proceso-hex) que vincula todas las tablas, logs de Airflow y quality gates generados en una misma corrida.', '-', 'ID de ejecución, Execution Run', '_trazabilidad/cargas, _trazabilidad/calidad'),
      ('Trazabilidad de Cargas', 'Plataforma Data Lakehouse', 'Técnico', 'Registro histórico persistente en Parquet (_trazabilidad/cargas/) de cada ejecución del pipeline: run_id, proceso, capa, tabla, origen, destino, filas, bytes, duración, estado y ejecutor.', '-', 'Auditoría de cargas, Load Traceability', '_trazabilidad/cargas, cargas')
  )
  SELECT * FROM glosario ORDER BY dominio, termino
