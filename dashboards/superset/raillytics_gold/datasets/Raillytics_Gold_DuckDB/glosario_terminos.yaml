table_name: glosario_terminos
main_dttm_col: null
description: Glosario oficial de conceptos de negocio ferroviario y arquitectura técnica de la plataforma.
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
catalog: null
sql: |-
  -- Glosario de Términos de Raillytics: conceptos oficiales declarados en config/glosario.yml
  -- Se genera con `make catalog` (raillytics.catalog): no lo edites a mano.
  WITH glosario(termino, dominio, tipo, definicion, formula, sinonimos, tablas_relacionadas, dashboards_relacionados, quality_gates, terminos_relacionados) AS (VALUES
      ('Corredor Ferroviario', 'Negocio Ferroviario', 'Negocio', 'Eje o infraestructura troncal que conecta grandes nodos urbanos o regiones geográficas (p. ej. Madrid–Barcelona, Madrid–Levante, Madrid–Andalucía). En Raillytics el análisis central se focaliza en el corredor de alta velocidad AVE-MAD-BCN.', '-', 'Corredor, Eje troncal', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_mercado_trimestral</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_viajeros</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ dim_linea</span>', '<a href="/superset/dashboard/mercado-corredor/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 mercado-corredor</a>, <a href="/superset/dashboard/demanda-ferroviaria/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 demanda-ferroviaria</a>, <a href="/superset/dashboard/prediccion-demanda/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 prediccion-demanda</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ corredor_madrid_barcelona_presente</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ lineas_en_viajeros</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros (Pax)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Cuota de Mercado (Market Share)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Servicios Comerciales Liberalizados</span>'),
      ('Cuota de Mercado (Market Share)', 'Negocio Ferroviario', 'Negocio', 'Proporción de la demanda total de viajeros capturada por un operador específico en un corredor o periodo respecto al conjunto de operadores en competencia.', 'round(100.0 * viajeros_operador / total_viajeros_corredor, 2)', 'Cuota, Participación de mercado', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_mercado_trimestral</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ mercado_trimestral</span>', '<a href="/superset/dashboard/mercado-corredor/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 mercado-corredor</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ cuota_maxima</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ grano_unico</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros (Pax)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Corredor Ferroviario</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Servicios Comerciales Liberalizados</span>'),
      ('Obligación de Servicio Público (OSP)', 'Negocio Ferroviario', 'Negocio', 'Servicios de transporte de viajeros garantizados por el Estado o administraciones autonómicas con compensaciones económicas públicas (p. ej. Cercanías, Media Distancia Convencional, Ancho Métrico).', '-', 'OSP, Servicio público regulado', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ cnmc_indicadores</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ cnmc_viajeros_producto</span>', '<a href="/superset/dashboard/mercado-corredor/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 mercado-corredor</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ empresas_conocidas</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Servicios Comerciales Liberalizados</span>'),
      ('Ocupación (Factor de Carga)', 'Negocio Ferroviario', 'Negocio', 'Porcentaje de aprovechamiento de la capacidad disponible, calculado como el cociente entre viajeros·km y plazas·km ofertadas (o viajeros entre plazas ofertadas).', 'round(100.0 * viajeros_km / plazas_km_ofertadas, 2)', 'Load Factor, Factor de ocupación', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_mercado_trimestral</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ cnmc_trimestral</span>', '<a href="/superset/dashboard/mercado-corredor/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 mercado-corredor</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ volumenes_no_negativos</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros (Pax)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Plazas Ofertadas</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros·km</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Plazas·km Ofertadas</span>'),
      ('Plazas Ofertadas', 'Negocio Ferroviario', 'Negocio', 'Capacidad nominal máxima de asientos comercializados por los operadores ferroviarios en las circulaciones puestas a disposición del público.', 'SUM(plazas_ofertadas)', 'Capacidad, Asientos disponibles', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_viajeros</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_mercado_trimestral</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ cnmc_viajeros_corredor</span>', '<a href="/superset/dashboard/mercado-corredor/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 mercado-corredor</a>, <a href="/superset/dashboard/demanda-ferroviaria/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 demanda-ferroviaria</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ volumenes_no_negativos</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros (Pax)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Plazas·km Ofertadas</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Ocupación (Factor de Carga)</span>'),
      ('Plazas·km Ofertadas', 'Negocio Ferroviario', 'Negocio', 'Medida de oferta total de capacidad obtenida multiplicando el número de plazas ofertadas de cada tren por los kilómetros de su recorrido.', 'SUM(plazas_ofertadas * distancia_km)', 'Asientos-kilómetro ofertados (AKO)', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ cnmc_trimestral</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_mercado_trimestral</span>', '<a href="/superset/dashboard/mercado-corredor/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 mercado-corredor</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ volumenes_no_negativos</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Plazas Ofertadas</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros·km</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Ocupación (Factor de Carga)</span>'),
      ('Precio Medio por Trayecto', 'Negocio Ferroviario', 'Negocio', 'Importe promedio del billete abonado por viajero para un par origen-destino determinado en el periodo de análisis.', 'AVG(precio_eur)', 'Tarifa media, Average Fare', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_precio_mensual</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_precio_trimestral</span>', '<a href="/superset/dashboard/mercado-corredor/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 mercado-corredor</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ precio_positivo</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros (Pax)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Cuota de Mercado (Market Share)</span>'),
      ('Puntualidad Comercial', 'Negocio Ferroviario', 'Negocio', 'Porcentaje de servicios ferroviarios que llegan a destino o estación intermedia dentro del margen de tolerancia de retraso establecido (en alta velocidad habitualmente < 5 minutos).', 'round(100.0 * COUNT(CASE WHEN retraso_minutos <= 5 THEN 1 END) / COUNT(*), 2)', 'On-Time Performance (OTP), Índice de puntualidad', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_puntualidad</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ puntualidad_servicios</span>', '<a href="/superset/dashboard/puntualidad/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 puntualidad</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ retraso_no_negativo</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ realizado_con_retraso</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ cancelado_sin_retraso</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Retraso Medio</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Tasa de Cancelación</span>'),
      ('Retraso Medio', 'Negocio Ferroviario', 'Negocio', 'Tiempo medio en minutos de demora acumulada por los trenes en circulación respecto al horario comercial teórico programado.', 'AVG(retraso_minutos)', 'Demora media, Delay', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_puntualidad</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ puntualidad_servicios</span>', '<a href="/superset/dashboard/puntualidad/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 puntualidad</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ retraso_no_negativo</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ realizado_con_retraso</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Puntualidad Comercial</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Tasa de Cancelación</span>'),
      ('Servicios Comerciales Liberalizados', 'Negocio Ferroviario', 'Negocio', 'Servicios ferroviarios de Alta Velocidad y Larga Distancia explotados a riesgo y ventura de empresas ferroviarias autorizadas en régimen de competencia efectiva (Renfe Viajeros, ILSA / Iryo, Ouigo España).', '-', 'Servicios liberalizados, Larga Distancia AV', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_mercado_trimestral</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ dim_operador</span>', '<a href="/superset/dashboard/mercado-corredor/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 mercado-corredor</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ corredor_madrid_barcelona_presente</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ operadores_en_viajeros</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Obligación de Servicio Público (OSP)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Cuota de Mercado (Market Share)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Corredor Ferroviario</span>'),
