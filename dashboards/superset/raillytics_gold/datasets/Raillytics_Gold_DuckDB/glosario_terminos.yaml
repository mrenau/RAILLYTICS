      ('Run ID', 'Plataforma Data Lakehouse', 'Técnico', 'Identificador unívoco temporal de ejecución (formato: AAAAMMDDTHHMMSS-proceso-hex) que vincula todas las tablas, logs de Airflow y quality gates generados en una misma corrida.', '-', 'ID de ejecución, Execution Run', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ _trazabilidad/cargas</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ _trazabilidad/calidad</span>', '<a href="/superset/dashboard/trazabilidad-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 trazabilidad-cargas</a>, <a href="/superset/dashboard/lineage-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 lineage-cargas</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ run_id_unico</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Trazabilidad de Cargas</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Frescura de Datos (Freshness)</span>'),
      ('Trazabilidad de Cargas', 'Plataforma Data Lakehouse', 'Técnico', 'Registro histórico persistente en Parquet (_trazabilidad/cargas/) de cada ejecución del pipeline: run_id, proceso, capa, tabla, origen, destino, filas, bytes, duración, estado y ejecutor.', '-', 'Auditoría de cargas, Load Traceability', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ _trazabilidad/cargas</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ cargas</span>', '<a href="/superset/dashboard/trazabilidad-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 trazabilidad-cargas</a>, <a href="/superset/dashboard/lineage-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 lineage-cargas</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ carga_registrada</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ anomalia_volumen</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ anomalia_duracion</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Run ID</span>, <span style="display:inline-block;background:#e6fffa;color:#