table_name: cargas
main_dttm_col: inicio
description: 'Trazabilidad de cargas del lake (raillytics.utils.cargas): una fila por ejecución y tabla cargada, leída de
  s3://raillytics-gold/_trazabilidad/cargas/.'
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
catalog: null
sql: |-
  -- Trazabilidad de cargas con detección de anomalías en volumen y duración.
  -- inicio y fin se guardan en UTC; aquí se muestran en hora de Madrid.
  WITH base AS (
      SELECT
          run_id,
          proceso,
          capa,
          tabla,
          origen,
          destino,
          filas,
          bytes,
          timezone('Europe/Madrid', timezone('UTC', inicio)) AS inicio,
          timezone('Europe/Madrid', timezone('UTC', fin))    AS fin,
          duracion_s,
          estado,
          error,
          parametros,
          lanzado_por,
          ejecutor,
          usuario
      FROM read_parquet('s3://raillytics-gold/_trazabilidad/cargas/*.parquet', union_by_name = true)
  ),
  con_stats AS (
      SELECT
          *,
          round(avg(filas) OVER (PARTITION BY coalesce(tabla, proceso)), 0) AS media_filas,
          round(avg(duracion_s) OVER (PARTITION BY coalesce(tabla, proceso)), 1) AS media_duracion
      FROM base
  )
  SELECT
      run_id,
      proceso,
      capa,
      tabla,
      origen,
      destino,
      filas,
      bytes,
      inicio,
      fin,
      duracion_s,
      estado,
      error,
      parametros,
      lanzado_por,
      ejecutor,
      usuario,
      media_filas,
      media_duracion,
      CASE
          WHEN media_filas > 0 AND filas IS NOT NULL
          THEN round(((filas - media_filas) / media_filas) * 100.0, 1)
          ELSE 0.0
      END AS desviacion_filas_pct,
      CASE
          WHEN media_duracion > 0 AND duracion_s IS NOT NULL
          THEN round(((duracion_s - media_duracion) / media_duracion) * 100.0, 1)
          ELSE 0.0
      END AS desviacion_duracion_pct,
      CASE
          WHEN filas IS NOT NULL AND media_filas >= 50
               AND (filas < 0.4 * media_filas OR filas > 2.5 * media_filas)
          THEN 'anómalo'
          ELSE 'normal'
      END AS anomalia_volumen,
      CASE
          WHEN duracion_s IS NOT NULL AND media_duracion >= 3.0
               AND duracion_s > 3.0 * media_duracion
          THEN 'lenta'
          ELSE 'normal'
      END AS anomalia_duracion
  FROM con_stats
