sql: |-
  -- Catálogo de Datos de Raillytics: datasets declarados en config/data_catalog.yml
  -- Se genera con `make catalog` (raillytics.catalog): no lo edites a mano.
  WITH catalog_tablas(tabla, nombre, capa, orden_capa, dominio, descripcion, grano, claves, formato, proceso, frecuencia, quality_gates, upstream, downstream, terminos_glosario, n_columnas) AS (VALUES
      ('cnmc_indicadores', 'Bronze CNMC Indicadores Globales', 'Bronze L2', 3, 'Ingesta y Fuentes Externas', 'Fichero CSV de indicadores trimestrales de transporte ferroviario publicado por el portal de datos abiertos de la CNMC.', 'Registro original del CSV fuente', 'Trimestre, Corredor, Empresa', 'Parquet (L2) / CSV (L1)', 'bronze_download -> raw_uploader -> parquet_converter', 'Trimestral', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ formato_declarado</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ min_bytes</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ min_filas</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ columnas_obligatorias</span>', 'fuente:cnmc_indicadores', '<span style="display:inline-block;background:#edf2f7;color:#2d3748;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;">silver:cnmc_trimestral</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Obligación de Servicio Público (OSP)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Tren·km</span>', 3),
      ('crtm', 'Bronze CRTM Consorcio Madrid', 'Bronze L2', 3, 'Ingesta y Fuentes Externas', 'Archivo GTFS ZIP estático del Consorcio Regional de Transportes de Madrid con paradas, rutas y horarios.', 'Múltiples ficheros desglosados (stops, routes, trips, stop_times)', 'stop_id, route_id, trip_id', 'Parquet (L2) / ZIP (L1)', 'bronze_download -> raw_uploader -> parquet_converter', 'Mensual / Bajo demanda', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ formato_declarado</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ zip_valido</span>', 'fuente:crtm', '<span style="display:inline-block;background:#edf2f7;color:#2d3748;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;">silver:viajeros_enriquecidos</span>, <span style="display:inline-block;background:#edf2f7;color:#2d3748;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;">gold:dim_linea</span>', '-', 2),
      ('renfe_trip_updates', 'Bronze Renfe GTFS-RT Trip Updates', 'Bronze L2', 3, 'Ingesta y Fuentes Externas', 'Feed continuo JSON GTFS-RT de Renfe Operadora con previsiones y actualizaciones de tiempo de paso en vivo.', 'Una actualización de viaje y parada', 'trip_id, stop_sequence', 'Parquet (L2) / JSON (L1)', 'bronze_download -> raw_uploader -> parquet_converter', 'Continuo (Streaming)', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ formato_declarado</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ json_valido</span>', 'fuente:renfe_trip_updates', '<span style="display:inline-block;background:#edf2f7;color:#2d3748;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;">silver:puntualidad_enriquecida</span>', '-', 2),
      ('cnmc_precio_mensual', 'Silver CNMC Precios Mensuales', 'Silver', 4, 'Mercado y Tarifas', 'Registro de precios medios mensuales por trayecto y empresa normalizados a formato canónico.', 'Un mes, empresa, servicio, producto y trayecto', 'anio_mes, empresa, servicio, producto, trayecto', 'Delta Lake', 'silver_builder', 'Mensual', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ no_nulos_claves</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ precios_positivos</span>', 'l2:cnmc_precio_mensual', '<span style="display:inline-block;background:#edf2f7;color:#2d3748;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;">gold:fact_precio_mensual</span>', '-', 4),
      ('cnmc_precio_trimestral', 'Silver CNMC Precios Trimestrales', 'Silver', 4, 'Mercado y Tarifas', 'Registro de precios medios trimestrales por trayecto comercial.', 'Un trimestre, empresa, servicio, producto y trayecto', 'trimestre, empresa, servicio, producto, trayecto', 'Delta Lake', 'silver_builder', 'Trimestral', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ no_nulos_claves</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ precios_positivos</span>', 'l2:cnmc_precio_trimestral', '<span style="display:inline-block;background:#edf2f7;color:#2d3748;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;">gold:fact_precio_trimestral</span>', '-', 4),
      ('cnmc_trimestral', 'Silver CNMC Indicadores Trimestrales', 'Silver', 4, 'Mercado y Competencia', 'Datos depurados, deduplicados y tipados procedentes del informe trimestral oficial de la CNMC.', 'Un trimestre, producto, corredor, empresa y tipo de servicio', 'trimestre, producto, corredor, empresa, servicio', 'Delta Lake', 'silver_builder', 'Trimestral', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ grano_unico</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ no_nulos_claves</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ serie_actualizada</span>', 'l2:cnmc_indicadores', '<span style="display:inline-block;background:#edf2f7;color:#2d3748;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;">gold:fact_mercado_trimestral</span>, <span style="display:inline-block;background:#edf2f7;color:#2d3748;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;">gold:dim_operador</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Ocupación (Factor de Carga)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Plazas Ofertadas</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Plazas·km Ofertadas</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros (Pax)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros·km</span>', 8),
      ('cnmc_viajeros_corredor', 'Silver CNMC Viajeros por Corredor', 'Silver', 4, 'Mercado y Competencia', 'Serie histórica trimestral de alta velocidad desglosada por corredor y operador.', 'Un trimestre, corredor y empresa', 'trimestre, corredor, empresa', 'Delta Lake', 'silver_builder', 'Trimestral', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ grano_unico</span>', 'l2:cnmc_viajeros_corredor', '<span style="display:inline-block;background:#edf2f7;color:#2d3748;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;">gold:fact_mercado_trimestral</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Plazas Ofertadas</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros (Pax)</span>', 4),
