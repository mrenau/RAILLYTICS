      ('puntualidad_enriquecida', 'Silver Puntualidad Enriquecida', 'Silver', 4, 'Operaciones y Puntualidad', 'Tiempos de paso por estaciones y retrasos computados cruzando eventos GTFS-RT con horarios teóricos.', 'Un evento de parada de un servicio', 'servicio_id, fecha, estacion_id', 'Delta Lake', 'silver_sample / silver_builder', 'Streaming / Tiempo Real', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ retraso_valido</span>', 'l2:renfe_trip_updates, l2:renfe_vehicle_positions', '<span style="display:inline-block;background:#edf2f7;color:#2d3748;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;">gold:fact_puntualidad</span>', '-', 3),
      ('viajeros_enriquecidos', 'Silver Viajeros Enriquecidos', 'Silver', 4, 'Demanda y Tráfico', 'Datos de viajeros por servicio con normalización de estaciones e imputación de variables meteorológicas y de calendario.', 'Un servicio ferroviario y fecha', 'servicio_id, fecha', 'Delta Lake', 'silver_sample / silver_builder', 'Streaming / Batch', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ claves_validas</span>', 'l2:renfe_trip_updates, l2:crtm', '<span style="display:inline-block;background:#edf2f7;color:#2d3748;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;">gold:fact_viajeros</span>, <span style="display:inline-block;background:#edf2f7;color:#2d3748;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;">gold:dim_estacion</span>', '-', 3),
