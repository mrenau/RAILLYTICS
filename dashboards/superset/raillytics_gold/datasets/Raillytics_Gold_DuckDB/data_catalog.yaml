table_name: data_catalog
main_dttm_col: null
description: Catálogo unificado de tablas del Data Lakehouse con metadatos de capa, dominio, grano, claves, proceso y reglas de calidad.
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
