table_name: lineage_reglas
main_dttm_col: evaluada
description: Reglas de calidad de cada nodo con su último resultado; las declaradas que nunca se evaluaron figuran «sin evaluar».
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
catalog: null
sql: |-
  -- Lineage · cada regla de calidad con su último resultado: las declaradas en config/quality_gates.yml (aunque nunca se hayan evaluado)
  -- y las que solo existen en código (los gates de fichero de la descarga, el de L1 y los de L2).
  -- Se genera con `make lineage` (raillytics.lineage): no lo edites a mano.
  WITH declaradas(nodo, gate, tipo, severidad, descripcion) AS (VALUES
      ('gold:dim_estacion', 'clave_unica', 'unico', 'bloqueante', 'sin duplicados por estacion_id'),
      ('gold:dim_estacion', 'filas_minimas', 'filas_min', 'bloqueante', 'al menos 1 filas'),
      ('gold:dim_estacion', 'sin_nulos', 'no_nulos', 'bloqueante', 'sin nulos en estacion_id, nombre'),
      ('gold:dim_fecha', 'clave_unica', 'unico', 'bloqueante', 'sin duplicados por fecha_id'),
      ('gold:dim_fecha', 'dia_semana_valido', 'rango', 'bloqueante', 'dia_semana ≥ 1 y ≤ 7'),
      ('gold:dim_fecha', 'filas_minimas', 'filas_min', 'bloqueante', 'al menos 1 filas'),
      ('gold:dim_fecha', 'sin_nulos', 'no_nulos', 'bloqueante', 'sin nulos en fecha_id, fecha, anio, trimestre, mes, dia_semana, es_festivo, estacion_anio'),
      ('gold:dim_linea', 'clave_unica', 'unico', 'bloqueante', 'sin duplicados por linea_id'),
      ('gold:dim_linea', 'filas_minimas', 'filas_min', 'bloqueante', 'al menos 1 filas'),
      ('gold:dim_linea', 'sin_nulos', 'no_nulos', 'bloqueante', 'sin nulos en linea_id, nombre, tipo_tren'),
      ('gold:dim_operador', 'clave_unica', 'unico', 'bloqueante', 'sin duplicados por operador_id'),
      ('gold:dim_operador', 'filas_minimas', 'filas_min', 'bloqueante', 'al menos 1 filas'),
