      ('silver:viajeros_enriquecidos', 'atributos_operador_sin_nulos', 'no_nulos', 'aviso', 'sin nulos en operador_nombre, operador_empresa, operador_segmento'),
      ('silver:viajeros_enriquecidos', 'claves_sin_nulos', 'no_nulos', 'bloqueante', 'sin nulos en fecha, estacion_id, linea_id, operador_id, viajeros'),
      ('silver:viajeros_enriquecidos', 'condicion_meteo_valida', 'dominio', 'aviso', 'condicion_meteo dentro de despejado, nuboso, lluvia, tormenta'),
