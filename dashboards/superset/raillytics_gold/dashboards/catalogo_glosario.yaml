    meta:
      width: 12
      height: 18
      code: '### Catálogo de Datos y Glosario de Términos

        Bienvenido al centro de gobernanza y metadatos de **Raillytics**. En la pestaña **Catálogo de Datos** puedes consultar todas las tablas de las capas Bronze, Silver y Gold, su nivel de grano, claves primarias, procesos productores, reglas de calidad y diccionario de columnas. En la pestaña **Glosario de Términos** encontrarás la definición formal y fórmulas de los conceptos clave del mercado ferroviario y de la plataforma. Para consultar el flujo y trazabilidad operativa de cargas, visita el [Lineage de cargas](/superset/dashboard/lineage-cargas/) y la [Trazabilidad de cargas](/superset/dashboard/trazabilidad-cargas/).'
