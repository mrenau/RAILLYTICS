  MARKDOWN-intro:
    type: MARKDOWN
    id: MARKDOWN-intro
    children: []
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-intro
    meta:
      width: 12
      height: 22
      code: '### Cómo leerlo

        Cada **nodo** es una fuente, un fichero o tabla de una capa (staging, Bronze L1/L2, Silver, Gold), la predicción, un dataset o un dashboard. Cada **flecha** es una transformación (descarga HTTP, copia a MinIO, CSV→Parquet, SQL de Silver o Gold, dataset…) y su grosor crece con las filas de la última carga. El grafo sale del propio repositorio (`make lineage`) y se cruza con lo que de verdad se cargó (`_trazabilidad`): un nodo declarado que nunca se ha ejecutado figura como **sin ejecutar**. Más abajo: estado de cada nodo, reglas de calidad con su último resultado, las ejecuciones con su error y los enlaces a los logs de Airflow.'
