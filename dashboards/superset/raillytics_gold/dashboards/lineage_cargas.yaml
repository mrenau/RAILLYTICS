dashboard_title: Lineage de cargas
description: 'Grafo de lineage de las cargas del lake: de la fuente al dashboard, con la transformación de cada salto, la capa y tabla, las reglas de calidad y sus resultados, y los errores y logs de cada ejecución. El grafo sale del repositorio (make lineage) y se cruza con s3://raillytics-gold/_trazabilidad/.'
